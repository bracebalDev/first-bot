[project]
name = "first-bot"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "merzamac",email = "100945727+merzamac@users.noreply.github.com"},
]
dependencies = [
    "pandas>=3.0.5",
    "openpyxl>=3.1",
    "pydantic[email]>=2.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "playwright>=1.40",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[tool.pdm]
distribution = true
